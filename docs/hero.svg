<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="dsh-look-bilibili — Bilibili video background for DeepSeek Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151c26"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4d8bfe" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4d8bfe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb7299" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fb7299" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2530" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#10161d" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ad0a4"/>
      <stop offset="1" stop-color="#7fe0c0"/>
    </linearGradient>
  </defs>

  <rect width="880" height="260" rx="22" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="879" height="259" rx="21.5" fill="none" stroke="#243040"/>

  <ellipse cx="690" cy="86" rx="190" ry="120" fill="url(#glowA)"/>
  <ellipse cx="760" cy="196" rx="150" ry="110" fill="url(#glowB)"/>

  <!-- left: title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="60" y="104" font-size="40" font-weight="700" fill="#f2f6fb" letter-spacing="-0.5">dsh-look-bilibili</text>
    <text x="61" y="140" font-size="17" fill="#8fa1b6">把 B 站视频做成 DeepSeek Harness 的全屏动态壁纸</text>
    <g font-size="13" fill="#a9bccf">
      <rect x="60" y="166" width="92" height="28" rx="14" fill="#16202c" stroke="#2a3a4c"/>
      <text x="106" y="185" text-anchor="middle">全屏铺满</text>
      <rect x="162" y="166" width="92" height="28" rx="14" fill="#16202c" stroke="#2a3a4c"/>
      <text x="208" y="185" text-anchor="middle">悬停展开</text>
      <rect x="264" y="166" width="118" height="28" rx="14" fill="#16202c" stroke="#2a3a4c"/>
      <text x="323" y="185" text-anchor="middle">Agent 可换片</text>
    </g>
    <text x="61" y="222" font-size="13" fill="#61748a">DSH plugin · Windows · Win32 input bridge · MIT</text>
  </g>

  <!-- right: the widget, collapsed dot + expanded card -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- card -->
    <rect x="606" y="72" width="226" height="92" rx="12" fill="url(#card)" stroke="#2b3a4a"/>
    <!-- row 1: prev, progress, pause, next -->
    <g fill="#9fb2c6">
      <path d="M622 88 L616 94 L622 100 Z"/>
      <path d="M630 88 L624 94 L630 100 Z"/>
      <rect x="786" y="88" width="3" height="12" rx="1.5"/>
      <rect x="792" y="88" width="3" height="12" rx="1.5"/>
      <path d="M802 88 L808 94 L802 100 Z"/>
      <path d="M810 88 L816 94 L810 100 Z"/>
    </g>
    <rect x="638" y="91" width="132" height="6" rx="3" fill="#2a3a4a"/>
    <rect x="638" y="91" width="72" height="6" rx="3" fill="url(#bar)"/>
    <circle cx="710" cy="94" r="5" fill="#eaf6f1"/>
    <!-- row 2: status pills -->
    <g font-size="10.5" fill="#9fb2c6">
      <text x="620" y="126">B站背景</text>
      <rect x="662" y="114" width="26" height="16" rx="8" fill="#20303f"/>
      <text x="675" y="126" text-anchor="middle" fill="#7fe0c0">开</text>
      <rect x="694" y="114" width="24" height="16" rx="8" fill="#20303f"/>
      <text x="706" y="126" text-anchor="middle">弱</text>
      <rect x="722" y="114" width="24" height="16" rx="8" fill="#2f6f57"/>
      <text x="734" y="126" text-anchor="middle" fill="#eaf6f1">中</text>
      <rect x="750" y="114" width="24" height="16" rx="8" fill="#20303f"/>
      <text x="762" y="126" text-anchor="middle">强</text>
      <rect x="778" y="114" width="40" height="16" rx="8" fill="#20303f"/>
      <text x="798" y="126" text-anchor="middle">静音</text>
    </g>
    <!-- row 3: hint -->
    <text x="620" y="150" font-size="10" fill="#5c7085">悬停展开 · 拖动小点移动 · 双击回到角落</text>

    <!-- connector + dot -->
    <path d="M598 118 H592" stroke="#3a4c60" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="584" cy="118" r="7" fill="#1b2b36" stroke="#33475c"/>
    <circle cx="584" cy="118" r="3" fill="#5ad0a4"/>
    <text x="584" y="150" font-size="10" fill="#5c7085" text-anchor="middle">14px</text>
  </g>
</svg>
